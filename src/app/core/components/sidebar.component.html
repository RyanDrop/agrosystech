<button class="agro" (click)="isOpened.set(!isOpened())" (keydown.enter)="isOpened.set(!isOpened())">
  @if (computedIsOpen()) {
    <img [src]="'assets/images/logo-text.png'" alt="Agrosystech Logo" [class.opened]="isOpened()" />
  } @else {
    <i nz-icon nzType="double-right" nzTheme="outline"></i>
  }
</button>
<nz-list nzItemLayout="horizontal" [nzLoading]="isLoading()" nzSize="small">
  @for (item of listData; track item) {
    <nz-list-item>
      <nz-list-item-meta-title>
        @if (isOpened()) {
          <a
            tabindex="0"
            (click)="isMobile() && isOpened.set(false); navigateTo(item)"
            (keydown.enter)="isMobile() && isOpened.set(false); navigateTo(item)"
          >
            <i nz-icon [nzType]="item.icon" nzTheme="outline"></i>{{ item.title }}</a
          >
        } @else {
          <a
            tabindex="0"
            (click)="isMobile() && isOpened.set(false); navigateTo(item)"
            (keydown.enter)="isMobile() && isOpened.set(false); navigateTo(item)"
            ><i nz-icon [nzType]="item.icon" nzTheme="outline"></i
          ></a>
        }
      </nz-list-item-meta-title>
    </nz-list-item>
  }
  @if (listData.length === 0) {
    <nz-list-empty />
  }
</nz-list>
