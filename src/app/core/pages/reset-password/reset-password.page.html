<main>
  <form nz-form nzLayout="vertical">
    <nz-form-item>
      <nz-form-label nzFor="password">Nova senha</nz-form-label>
      <nz-form-control nzErrorTip="Por favor, insira uma senha válida">
        <input nz-input type="password" [formControl]="password" name="password" min="8" max="32" />
      </nz-form-control>
    </nz-form-item>
    <button nz-button nzType="primary" nzBlock (click)="submit()" type="button" [disabled]="password.invalid">
      Atualizar senha
    </button>
  </form>
</main>
