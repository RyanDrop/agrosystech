<header class="crud">
  <h1>Formulário de Clientes</h1>
  <span>Crie ou edite um cliente.</span>
</header>
<nz-divider></nz-divider>
<main class="crud">
  <div class="form-body">
    <agro-dynamic-form [config]="dynamicFormConfig" />
  </div>
</main>
<nz-divider></nz-divider>
<footer class="crud">
  <button class="agro" nz-button nzType="primary" nzDanger class="mr-4" (click)="cancel('customers')">Voltar</button>
  @if (isConsult()) {
    <button class="agro" nz-button nzType="primary" (click)="navigateTo('/customers/form/' + customer().id + '/edit')">
      Editar
    </button>
  } @else {
    <button class="agro" nz-button nzType="primary" (click)="submit()" [disabled]="dynamicForm.form.invalid">Confirmar</button>
  }
</footer>
