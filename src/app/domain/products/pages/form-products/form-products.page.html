<header class="crud">
  <h1>Formulário de Produtos</h1>
  <span>Crie ou edite um produto.</span>
</header>
<nz-divider></nz-divider>
<main class="crud">
  <div class="form-body">
    <agro-dynamic-form [config]="productConfig" />
  </div>
</main>
<nz-divider></nz-divider>
<footer class="crud">
  <button nz-button nzType="primary" nzDanger class="mr-4" (click)="cancel('products')">Voltar</button>
  @if (isConsult()) {
    <button nz-button nzType="primary" (click)="navigateTo('/products/form/' + product().id + '/edit')">Editar</button>
  } @else {
    <button nz-button nzType="primary" (click)="submit('products')" [disabled]="dynamicForm?.form?.invalid">Confirmar</button>
  }
</footer>
