<header class="crud">
  <h1>Listagem de Pedidos</h1>
  <span>Gerencie seus pedidos, ações de criação, edição e exclusão.</span>
</header>
<nz-divider></nz-divider>
<main class="crud">
  <div class="flex">
    <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
      <input type="text" nz-input placeholder="Pesquisar pedido por data" />
    </nz-input-group>
    <ng-template #suffixIconButton>
      <button nz-button nzType="primary" nzSearch><nz-icon nzType="search" /></button>
    </ng-template>
    <button
      nz-button
      nzType="primary"
      class="ml-4"
      (click)="navigateTo('/purchase-orders/form')"
      (keydown.enter)="navigateTo('/purchase-orders/form')"
    >
      Novo
    </button>
  </div>
  <nz-divider></nz-divider>
  <nz-table #basicTable [nzData]="listOfData">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      @for (data of basicTable.data; track data) {
        <tr class="table-row">
          <td>{{ data.name }}</td>
          <td>
            <nz-icon
              nzType="eye"
              nzTheme="outline"
              nzTooltipTitle="Consultar"
              nzTooltipPlacement="bottom"
              nz-tooltip
              nzTooltipColor="#178a0c"
              (click)="navigateTo('/purchase-orders/form/' + data.id + '/consult')"
            />
            <nz-icon
              nzType="edit"
              nzTheme="outline"
              nzTooltipTitle="Editar"
              nzTooltipPlacement="bottom"
              nz-tooltip
              nzTooltipColor="#178a0c"
              (click)="navigateTo('/purchase-orders/form/' + data.id + '/edit')"
            />
            <nz-icon
              nzType="delete"
              nzTheme="outline"
              nzTooltipTitle="Excluir"
              nzTooltipPlacement="bottom"
              nz-tooltip
              nzTooltipColor="#178a0c"
              (click)="deleteOrder(data.id)"
            />
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</main>
<nz-divider></nz-divider>
<footer class="crud"></footer>
