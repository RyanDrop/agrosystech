<main>
  <form>
    <agro-dynamic-form #passwordForm [config]="formConfig" />
    <button
      nz-button
      class="agro"
      nzType="primary"
      nzBlock
      (click)="submit()"
      [disabled]="passwordForm.form.invalid"
      [nzLoading]="loadingService.loading()"
      type="button"
      class="mb-[24px]"
    >
      Enviar e-mail
    </button>
    <button class="agro" nz-button [nzType]="'link'" nzBlock routerLink="/auth" type="button">Voltar</button>
  </form>
</main>
